# values.yaml — kube-prometheus-stack chart configuration
#
# Sized for a single-node k3s lab/dev cluster: retention and resources are
# deliberately reduced compared to the chart's defaults (designed for a
# multi-node production cluster).

grafana:
  enabled: true
  adminPassword: "admin123"   # change in production; fine for a lab
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 512Mi   # 256Mi was too tight: Grafana 13.x with its default
                       # plugins (traces, pyroscope, loki...) exceeds that
                       # under real usage -> OOMKilled observed in testing.
  # Default dashboards (cluster, nodes, pods) already provided by the chart
  defaultDashboardsEnabled: true
  # Relaxed probes: on a shared lab machine (CPU/RAM also used elsewhere),
  # Grafana's startup time can far exceed the chart's default delays,
  # which was causing restart loops (liveness probe killing the process
  # before startup finished).
  livenessProbe:
    initialDelaySeconds: 120
    timeoutSeconds: 10
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 60
    timeoutSeconds: 10
    failureThreshold: 6

prometheus:
  prometheusSpec:
    retention: 3d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # Chart's default volume (emptyDir): data does not survive a pod
    # restart. Fine for a lab, revisit in production with a storageClass
    # + PVC.

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # The Discord receiver config is applied separately via
  # monitoring/alertmanager-config.yaml (step 6) to keep alert routing
  # decoupled from the chart installation.

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

# Components not needed on a single-node k3s lab cluster
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
