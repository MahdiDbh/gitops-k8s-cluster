# alertmanager-config.yaml — Alertmanager configuration: routes alerts to
# a native Discord receiver (Alertmanager >= 0.25).
#
# IMPORTANT — security:
# The real Discord webhook URL NEVER appears in this file or in Git (it
# would let anyone post to the Discord channel). It is stored only in a
# Kubernetes Secret (`alertmanager-discord-webhook`), created manually on
# the cluster (command at the bottom of this file) and referenced here by
# name/key only.
#
# This file is applied as an `AlertmanagerConfig` (prometheus-operator
# CRD), which complements — not replaces — the base config set by the
# kube-prometheus-stack chart.

apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: discord-alerts
  namespace: monitoring
  labels:
    # Must match the chart's alertmanagerConfigSelector
    # (release: kube-prometheus-stack, set by default by the chart)
    release: kube-prometheus-stack
spec:
  route:
    receiver: discord
    groupBy: ["alertname", "namespace"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h

  receivers:
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: webhookURL
          title: '{{ .CommonLabels.alertname }}'
          message: |
            **Status:** {{ .Status }}
            **Namespace:** {{ .CommonLabels.namespace }}
            **Summary:** {{ .CommonAnnotations.summary }}
            **Description:** {{ .CommonAnnotations.description }}

---
# The `alertmanager-discord-webhook` Secret referenced above is NOT
# defined in Git (it would contain the real webhook URL). It is created
# once, manually, directly on the cluster:
#
#   kubectl create secret generic alertmanager-discord-webhook \
#     --namespace monitoring \
#     --from-literal=webhookURL='https://discord.com/api/webhooks/XXXX/YYYY'
#
# This Secret already exists on this cluster (created when alerting was
# set up). Reproduce it manually on any new environment.
