apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-nginx
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/MahdiDbh/gitops-k8s-cluster.git
    targetRevision: main
    path: apps/hello-nginx

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true      # remove from the cluster what was removed from Git
      selfHeal: true    # revert changes made outside Git (kubectl edit, etc.)
    syncOptions:
      - CreateNamespace=true
